<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Magica - turn-based PvP magic duels" />
    <link rel="stylesheet" href="./src/styles.css" />
    <title>Magica</title>
  </head>
  <body>
    <main id="app"></main>
    
    <!-- Game Logic -->
    <script src="./src/spells.js" defer></script>
    <script src="./src/gameRules.js" defer></script>
    <script src="./src/gameEngine.js" defer></script>
    <script src="./src/tests.js" defer></script>
    
    <!-- UI -->
    <script src="./src/screenManager.js" defer></script>
    
    <!-- Supabase & API (inline module) -->
    <script type="module">
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      
      const supabaseUrl = 'https://ermfvdnfhnosyjyvlxjq.supabase.co';
      const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVybWZ2ZG5maG5vc3lqeXZseGpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwNzkxNzYsImV4cCI6MjEwNjY1NTE3Nn0.lu_87GX49fkp39zMIAPpMVc3AyUOn7UqSHaUBRXrNes';
      
      const supabase = createClient(supabaseUrl, supabaseAnonKey);
      
      // Export API functions globally
      window.getOrCreatePlayer = async (nickname) => {
        try {
          const { data: existing, error: queryError } = await supabase
            .from('players')
            .select('id, nickname')
            .eq('nickname', nickname)
            .single();

          if (queryError && queryError.code !== 'PGRST116') {
            throw queryError;
          }

          if (existing) {
            return { success: true, data: existing };
          }

          const { data: newPlayer, error: insertError } = await supabase
            .from('players')
            .insert([{ nickname }])
            .select('id, nickname')
            .single();

          if (insertError) {
            if (insertError.code === '23505') {
              return { success: false, error: 'nickname_taken' };
            }
            throw insertError;
          }

          return { success: true, data: newPlayer };
        } catch (error) {
          console.error('Error in getOrCreatePlayer:', error);
          return { success: false, error: 'database_error', details: error.message };
        }
      };

      window.createMatch = async (player1Id, player2Id) => {
        try {
          const { data, error } = await supabase
            .from('matches')
            .insert([{
              player1_id: player1Id,
              player2_id: player2Id,
              turn_count: 0
            }])
            .select('id')
            .single();

          if (error) throw error;
          return { success: true, data: data.id };
        } catch (error) {
          console.error('Error in createMatch:', error);
          return { success: false, error: 'database_error' };
        }
      };

      window.updateMatchResult = async (matchId, winnerId, isDraw, turnCount) => {
        try {
          const { error } = await supabase
            .from('matches')
            .update({
              winner_id: isDraw ? null : winnerId,
              is_draw: isDraw,
              turn_count: turnCount,
              ended_at: new Date().toISOString()
            })
            .eq('id', matchId);

          if (error) throw error;
          return { success: true };
        } catch (error) {
          console.error('Error in updateMatchResult:', error);
          return { success: false, error: 'database_error' };
        }
      };

      window.saveBattleLog = async (matchId, log) => {
        try {
          const { error } = await supabase
            .from('battle_logs')
            .insert([{
              match_id: matchId,
              turn_number: log.turnNumber,
              actor_id: log.actorId,
              action_type: log.type,
              spell_name: log.spellName || null,
              target_id: log.targetId || null,
              hp_before: log.hpBefore || null,
              hp_after: log.hpAfter || null,
              mana_before: log.manaBefore || null,
              mana_after: log.manaAfter || null,
              damage_dealt: log.damageDelt || 0,
              healing_amount: log.healingAmount || 0,
              status_effects: log.statusEffects ? log.statusEffects.join(',') : null,
              description: log.description
            }]);

          if (error) throw error;
          return { success: true };
        } catch (error) {
          console.error('Error in saveBattleLog:', error);
          return { success: false, error: 'database_error' };
        }
      };
    </script>
    
    <!-- Main Game -->
    <script src="./src/main.js" defer></script>
  </body>
</html>
